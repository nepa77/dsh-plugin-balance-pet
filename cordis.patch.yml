# dsh-plugin-balance-pet — the profile layer this bundle contributes.
#
# One row is enough: the package IS the Host plugin and the Client bundle, so the
# entry resolves to the package root (`.`), whose `apply()` registers the
# `/dsh-plugin-balance-pet/*` routes, and whose `exports["./client"]` gives the
# pet its browser bundle.
#
# Installed by:
#   dsh plugin --profile <profile> add <path or spec>
# which appends this package to `dsh.profile.bundles` in the profile manifest and
# applies this file as a patch layer. Removing it:
#   dsh plugin --profile <profile> remove dsh-plugin-balance-pet
- insert:
    - id: balance-pet
      name: dsh-plugin-balance-pet
